name: Atualizar Treino Visual
on:
  schedule:
    - cron: '31 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visual-training-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Consultar casos com figuras reutilizáveis
        run: python3 scripts/discover-visual-cases.py
      - name: Publicar catálogo no GitHub
        run: |
          git config user.name 'Mapa Clínico Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/visual-cases.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar catálogo do Treino Visual'
            git pull --rebase origin main
            git push origin main
          fi
